# 法答网精选答问 · 定时增量同步
# 每 7 天（每周日 UTC 20:00，北京时间周一 04:00）自动抓取一次；
# 也可在 Actions 页手动触发（workflow_dispatch）。
# 同步脚本按标题/链接去重，仅增量写入新增与变更条目，并更新时间戳；
# 抓取失败时保留上一次数据并记录状态（见 frontend/data/采集状态.md）。
name: 每7天增量同步法答网精选答问

on:
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install requests beautifulsoup4

      - name: 增量同步数据
        run: python scripts/sync_fawang.py

      - name: 提交并推送数据变更
        run: |
          git config user.name "fawang-sync[bot]"
          git config user.email "fawang-sync@users.noreply.github.com"
          git add frontend/data
          git diff --cached --quiet && echo "无数据变更" && exit 0
          git commit -m "data: 法答网精选答问增量同步 $(date -u +%F)"
          git push
