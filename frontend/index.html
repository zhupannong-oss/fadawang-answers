<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法答网精选答问知识库</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <div class="seal" aria-hidden="true">答</div>
      <div class="brand-text">
        <h1>法答网精选答问知识库</h1>
        <p class="subtitle">最高人民法院「法答网精选答问」全量收录 · 按批次与部门法双视图浏览 · 支持全文检索</p>
      </div>
    </div>
    <div class="header-stats" id="headerStats">
      <div class="stat"><span class="num" id="statBatches">–</span><span class="label">批次</span></div>
      <div class="stat"><span class="num" id="statQuestions">–</span><span class="label">问答</span></div>
      <div class="stat"><span class="num" id="statCats">–</span><span class="label">部门法</span></div>
    </div>
  </div>
  <div class="search-bar">
    <div class="search-box">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input type="search" id="searchInput" placeholder="检索关键词：如 诉讼时效、工伤认定、惩罚性赔偿…" autocomplete="off">
      <button class="clear-btn" id="clearSearch" title="清空检索" hidden>✕</button>
    </div>
  </div>
</header>

<nav class="control-bar" id="controlBar">
  <div class="control-inner">
    <div class="view-toggle" role="tablist" aria-label="浏览方式">
      <button class="toggle-btn active" data-view="batch" role="tab">按批次浏览</button>
      <button class="toggle-btn" data-view="category" role="tab">按部门法浏览</button>
    </div>
    <div class="filter-group">
      <label class="filter-label" for="batchSelect">批次</label>
      <select id="batchSelect"><option value="all">全部批次</option></select>
    </div>
    <div class="cat-chips" id="catChips" aria-label="部门法筛选"></div>
    <button class="reset-btn" id="resetFilters">重置筛选</button>
  </div>
</nav>

<main class="container">
  <div class="result-meta" id="resultMeta"></div>
  <div id="content"></div>
  <section class="about" id="about">
    <h2>数据说明与采集清单</h2>
    <div id="aboutContent" class="md-body"><p class="loading">加载中…</p></div>
  </section>
</main>

<footer class="site-footer">
  <p>数据来源：最高人民法院官网 · 人民法院报「法答网精选答问」栏目｜答疑意见仅供学习、研究和参考使用，不构成法律意见。</p>
  <p>本知识库以 Markdown 文件为唯一数据源渲染，全部内容可追溯至原始发布链接。</p>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
